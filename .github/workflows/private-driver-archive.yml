name: Private driver archive

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-private-archive.mjs'
      - '.github/workflows/private-driver-archive.yml'
      - 'README.md'
  workflow_dispatch:
  schedule:
    - cron: '35 6 * * 0'

permissions:
  contents: write

concurrency:
  group: private-driver-archive
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require private repository
        run: |
          set -euo pipefail
          VISIBILITY="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.visibility')"
          echo "Repository visibility: ${VISIBILITY}"
          if [ "${VISIBILITY}" != "private" ]; then
            if gh release view private-driver-archive --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "Repositório público: removendo release de preservação para não expor binários."
              gh release delete private-driver-archive --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
            fi
            echo "::error::Arquivamento abortado: o repositório precisa estar PRIVATE antes de preservar binários."
            exit 1
          fi

      - name: Sync private archive
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" private
          cd private
          git clone --depth 1 https://github.com/AlekseyMajeski/tutoriais.git public-site
          node scripts/sync-private-archive.mjs public-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/latest.json catalog/latest.md
          if git diff --cached --quiet; then
            echo "Catálogo sem alterações para commit."
          else
            git commit -m "archive: atualiza catálogo privado de drivers"
            git pull --rebase origin main
            git push
          fi
